<!DOCTYPE html>
<html>
<head>
    <title>Create New Task</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        a { margin-left: 10px; text-decoration: none; color: blue; }
    </style>
</head>
<body>
    <h1>Create New Task</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Task Title:</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div class="form-group">
            <label for="description">Task Description (Instructions for AI):</label>
            <textarea id="description" name="description" rows="5" required></textarea>
        </div>
        <button type="submit">Submit Task</button>
        <a href="{% url 'task_list' %}">Cancel</a>
    </form>
</body>
</html>
